<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430">
  <defs>
    <linearGradient id="term-bg-doc" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f1422" />
      <stop offset="100%" stop-color="#080b12" />
    </linearGradient>
    <linearGradient id="header-bg-doc" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a2238" />
      <stop offset="100%" stop-color="#121827" />
    </linearGradient>
    <filter id="term-shadow-doc" x="-3%" y="-3%" width="106%" height="112%" filterUnits="userSpaceOnUse">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14" />
      <feOffset dx="0" dy="10" />
      <feComponentTransfer><feFuncA type="linear" slope="0.5" /></feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#term-shadow-doc)">
    <!-- Window Frame -->
    <rect x="15" y="12" width="850" height="400" rx="14" fill="url(#term-bg-doc)" stroke="#222e47" stroke-width="1.5" />
    
    <!-- Title Bar -->
    <path d="M 15 26 A 14 14 0 0 1 29 12 L 851 12 A 14 14 0 0 1 865 26 L 865 48 L 15 48 Z" fill="url(#header-bg-doc)" />
    <line x1="15" y1="48" x2="865" y2="48" stroke="#1d273d" stroke-width="1" />

    <!-- macOS Traffic Light Buttons -->
    <circle cx="38" cy="30" r="6" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5" />
    <circle cx="58" cy="30" r="6" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5" />
    <circle cx="78" cy="30" r="6" fill="#27c93f" stroke="#1aab29" stroke-width="0.5" />

    <!-- Title Bar Header -->
    <text x="440" y="34" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif" font-size="12" font-weight="500" text-anchor="middle">ironmule doctor</text>

    <!-- Terminal output: ironmule doctor at a UTF-8 terminal, Apple M1 Max, 2026-09-26 -->
    <g font-family="'SF Mono', 'JetBrains Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace" font-size="13">
      <text x="40" y="80" xml:space="preserve"><tspan fill="#ff9100" font-weight="bold">$</tspan><tspan fill="#f1f5f9" font-weight="bold"> ironmule doctor</tspan></text>
      <text x="40" y="114" xml:space="preserve"><tspan fill="#ffaa33" font-weight="bold"> IronMule doctor</tspan><tspan fill="#94a3b8">  checking this machine</tspan></text>
      <text x="40" y="146" xml:space="preserve"><tspan fill="#10b981" font-weight="bold">   ✓</tspan><tspan fill="#f1f5f9">  Apple Silicon architecture   </tspan><tspan fill="#94a3b8">arm64 (Apple M1 Max)</tspan></text>
      <text x="40" y="170" xml:space="preserve"><tspan fill="#10b981" font-weight="bold">   ✓</tspan><tspan fill="#f1f5f9">  macOS                        </tspan><tspan fill="#94a3b8">Darwin</tspan></text>
      <text x="40" y="194" xml:space="preserve"><tspan fill="#10b981" font-weight="bold">   ✓</tspan><tspan fill="#f1f5f9">  Python                       </tspan><tspan fill="#94a3b8">3.12.13 (requires &gt;= 3.10)</tspan></text>
      <text x="40" y="218" xml:space="preserve"><tspan fill="#10b981" font-weight="bold">   ✓</tspan><tspan fill="#f1f5f9">  MLX                          </tspan><tspan fill="#94a3b8">0.32.0; importable (isolated probe)</tspan></text>
      <text x="40" y="242" xml:space="preserve"><tspan fill="#10b981" font-weight="bold">   ✓</tspan><tspan fill="#f1f5f9">  MLX-LM                       </tspan><tspan fill="#94a3b8">0.31.3; importable (isolated probe)</tspan></text>
      <text x="40" y="266" xml:space="preserve"><tspan fill="#10b981" font-weight="bold">   ✓</tspan><tspan fill="#f1f5f9">  NumPy                        </tspan><tspan fill="#94a3b8">2.5.2; importable (isolated probe)</tspan></text>
      <text x="40" y="290" xml:space="preserve"><tspan fill="#10b981" font-weight="bold">   ✓</tspan><tspan fill="#f1f5f9">  MLX Metal device             </tspan><tspan fill="#94a3b8">Metal GPU operation verified</tspan></text>
      <text x="40" y="324" xml:space="preserve"><tspan fill="#10b981"> ●</tspan><tspan fill="#10b981" font-weight="bold"> Ready</tspan><tspan fill="#f1f5f9">  all runtime prerequisites are available</tspan></text>
      <text x="40" y="348" xml:space="preserve"><tspan fill="#94a3b8">   next</tspan><tspan fill="#f1f5f9">  </tspan><tspan fill="#38bdf8">ironmule start</tspan><tspan fill="#f1f5f9"> to chat, </tspan><tspan fill="#38bdf8">ironmule benchmark</tspan><tspan fill="#f1f5f9"> to measure this machine</tspan></text>
    </g>
  </g>
</svg>
