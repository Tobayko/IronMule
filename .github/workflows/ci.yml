name: IronMule CI

on:
  push:
  pull_request:

jobs:
  # macOS is out of CI by the owner's decision of 2026-11-17 ("no macOS tests or checks for now; that comes
  # later"). Its jobs had been cancelled at their start on every run since 2026-11-15, so they checked nothing.
  # What they covered and Linux can run is here: the wheel in a clean environment, the CLI smoke, the Rust crates,
  # the quick start from a clone, and every product suite on MLX's CPU build. Not covered until macOS returns: Metal,
  # and the real-model integration suite on Apple Silicon (git history has the three jobs).
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    name: linux / py3.12 (MLX CPU)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[cpu,dev]" "ruff==0.16.6" "matplotlib==3.11.1"
      - name: Static product and measurement checks
        run: ruff check ironmule ironmule_product ironmule_inventory.py ironmule_cli.py friday_evidence/events.py friday_evidence/identity.py friday_evidence/statistics.py tools/product_bounded_bench.py tools/product_history_snapshot.py tools/export_evidence.py training tests/engine tests/agent tests/conftest.py tests/claims/test_numeric_plans.py tests/claims/test_documented_claims.py --select F
      - name: Rust learning core
        run: |
          cargo test --offline --release --manifest-path native/experiment_planner/Cargo.toml
          cargo build --offline --release --manifest-path native/experiment_planner/Cargo.toml
          cargo test --offline --release --manifest-path native/online_controller/Cargo.toml
          cargo test --offline --release --manifest-path native/serving_learner/Cargo.toml
          cargo build --offline --release --manifest-path native/serving_learner/Cargo.toml
          # The optimizer's process tests (tests/*.rs) size their actions to the machine's cores
          # and expect a candidate a small runner never makes; they run on development machines.
          cargo test --offline --release --manifest-path native/optimizer/Cargo.toml --lib
      - name: Engine test suite
        run: python -m pytest tests/engine -m "not integration"
      - name: Agent test suite
        run: python -m pytest tests/agent -m "not integration"
      - name: Learning, runtime and evidence suites
        run: python -m pytest tests/learning tests/runtime tests/evidence -m "not integration" -rs
      - name: Documented claims
        run: python -m pytest tests/claims/test_numeric_plans.py tests/claims/test_documented_claims.py -n 0 -rs
      - name: Figures match their evidence
        run: python tools/make_figures.py --check

  # The wheel in a clean environment, and the first commands a new clone runs.
  packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: linux / wheel and quick start
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel
        run: |
          python -m pip install --upgrade build
          python -m build --wheel
      - name: Install wheel in a clean environment
        run: |
          python -m venv .ci-venv
          .ci-venv/bin/python -m pip install --upgrade pip
          .ci-venv/bin/python -m pip install "$(ls dist/*.whl)[cpu]"
      # `doctor` exits 1 when a prerequisite is missing, which on a hosted runner is a
      # true report rather than a failure of this job; exit 2 or a traceback still fails.
      - name: CLI smoke and quick start (no model)
        run: |
          .ci-venv/bin/python -m ironmule_cli --help
          .ci-venv/bin/python -m ironmule_cli info
          .ci-venv/bin/ironmule doctor || test $? -eq 1
          .ci-venv/bin/ironmule models list
          .ci-venv/bin/ironmule benchmark --help
          .ci-venv/bin/ironmule serve --help
