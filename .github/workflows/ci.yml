name: IronMule CI

on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The engine package claims >= 3.10; tested on the two most recent series it
        # supports.
        python-version: ["3.11", "3.12"]
    name: macos / py${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheel
        run: |
          python -m pip install --upgrade build
          python -m build --wheel
      - name: Install wheel in a clean environment
        run: |
          python -m venv .ci-venv
          .ci-venv/bin/python -m pip install --upgrade pip
          .ci-venv/bin/python -m pip install dist/*.whl
          .ci-venv/bin/python -m pip install "pytest>=8" "pytest-xdist>=3" "numpy>=2"
      - name: CLI smoke (no model)
        run: |
          .ci-venv/bin/python -m ironmule_cli --help
          .ci-venv/bin/python -m ironmule_cli info
      - name: Static product and measurement checks
        run: |
          .ci-venv/bin/python -m pip install "ruff==0.16.6"
          .ci-venv/bin/ruff check ironmule ironmule_product ironmule_inventory.py ironmule_cli.py friday_evidence/events.py friday_evidence/identity.py friday_evidence/statistics.py tools/product_bounded_bench.py tools/product_history_snapshot.py tests/engine tests/conftest.py tests/test_numeric_plans.py tests/test_documented_claims.py --select F
      # The engine package's own suite depends on nothing outside the repository, so
      # it runs anywhere. AGENTS.md keeps hardware/speed claims on the target device;
      # this runner establishes correctness, not performance.
      - name: Engine test suite (no real-model integration)
        run: .ci-venv/bin/python -m pytest tests/engine -n 0 -m "not integration"
      # These two check public claims (README, docs/PROJECT_STATUS.md) against the
      # measured evidence they cite. A check whose run file is private measured data
      # skips (tests/conftest.py); the evidence itself lives in the research repository
      # and is gitignored here, so most of these checks skip on a runner and run in full
      # only on the machine that recorded the evidence.
      - name: Claims against their evidence
        run: .ci-venv/bin/python -m pytest tests/test_numeric_plans.py tests/test_documented_claims.py -n 0 -rs

  # R8: the real-model integration suite on a hosted Apple-Silicon runner, which does run
  # Metal (the doctor step above verifies the device). This is a compatibility check on a
  # machine that is not the target device, never evidence about its speed; AGENTS.md keeps
  # hardware claims on the target device. The pinned snapshot is cached across runs.
  macos-real-model:
    runs-on: macos-14
    timeout-minutes: 45
    name: macos / real model
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m venv .ci-venv
          .ci-venv/bin/python -m pip install --upgrade pip
          .ci-venv/bin/python -m pip install . "pytest>=8" "pytest-xdist>=3"
      - name: Cache the pinned Gemma 3 4B snapshot
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub/models--mlx-community--gemma-3-4b-it-4bit
          key: hf-gemma-3-4b-it-4bit-93724907d4ed1745d2fe50baadf3b0b01a65abf2
      - name: Download the snapshot the integration tests pin
        run: >
          .ci-venv/bin/python -c "from huggingface_hub import snapshot_download as s;
          s('mlx-community/gemma-3-4b-it-4bit', revision='93724907d4ed1745d2fe50baadf3b0b01a65abf2')"
      - name: Doctor
        run: .ci-venv/bin/python -m ironmule_cli doctor
      # The two `process_table` tests read every process this user owns and refuse any new one
      # they cannot attribute; the runner's own agent starts processes throughout, so they
      # failed here in two of four runs (2026-09-26). They need a quiet machine, not a runner.
      - name: Real-model integration suite
        run: .ci-venv/bin/python -m pytest tests/engine -m "integration and not process_table" -n 0 -rs

  # The README quick start is a contract. This job runs it the way a reader does:
  # a clone this workflow did not prepare, an editable install, and the commands
  # the README prints -- so a change that breaks the first five minutes fails here
  # rather than in somebody's terminal.
  fresh-clone:
    runs-on: macos-14
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    name: fresh clone / py${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Editable install from the clone
        run: python -m pip install -e .
      # `doctor` exits 1 when a prerequisite is missing, which on a virtualised
      # runner is a true report rather than a failure of this job. What is checked
      # here is that it runs and prints a report; exit 2 or a traceback still fails.
      - name: Quick start, verbatim
        run: |
          ironmule doctor || test $? -eq 1
          ironmule models list
          ironmule benchmark --help
          ironmule serve --help
          ironmule info
