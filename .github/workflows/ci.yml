name: IronMule CI

on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The engine package claims >= 3.10 and keeps being tested on 3.11.
        # The research tree needs 3.12 (requirements-apple-silicon.txt) and
        # removes itself from collection below that -- see tests/conftest.py.
        python-version: ["3.11", "3.12"]
    name: macos / py${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheel
        run: |
          python -m pip install --upgrade build
          python -m build --wheel
      - name: Install wheel in a clean environment
        run: |
          python -m venv .ci-venv
          .ci-venv/bin/python -m pip install --upgrade pip
          .ci-venv/bin/python -m pip install dist/*.whl
          .ci-venv/bin/python -m pip install "pytest>=8" "pytest-xdist>=3" "numpy>=2"
      - name: CLI smoke (no model)
        run: |
          .ci-venv/bin/python -m ironmule_cli --help
          .ci-venv/bin/python -m ironmule_cli info
      # A runner is not the target device. The research tree under tests/ binds
      # to this project's own machine by design -- gitignored evidence databases
      # under .friday-data/, a validated local model cache, a pinned engine
      # worktree, and its own .venv interpreter -- and AGENTS.md is explicit that
      # a test asserting MLX, Metal or model behaviour must have run on the
      # target device. So CI runs the engine package's own suite, which depends
      # on nothing outside the repository. The research suite runs on the target
      # device, which is the only place it can say anything true.
      - name: Engine test suite (no real-model integration)
        run: .ci-venv/bin/python -m pytest tests/engine -n 0 -m "not integration"
