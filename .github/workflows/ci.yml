name: IronMule CI

on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The engine package claims >= 3.10 and keeps being tested on 3.11.
        # The research tree needs 3.12 (requirements-apple-silicon.txt) and
        # removes itself from collection below that -- see tests/conftest.py.
        python-version: ["3.11", "3.12"]
    name: macos / py${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheel
        run: |
          python -m pip install --upgrade build
          python -m build --wheel
      - name: Install wheel in a clean environment
        run: |
          python -m venv .ci-venv
          .ci-venv/bin/python -m pip install --upgrade pip
          .ci-venv/bin/python -m pip install dist/*.whl
          .ci-venv/bin/python -m pip install "pytest>=8" "pytest-xdist>=3" "numpy>=2"
      - name: CLI smoke (no model)
        run: |
          .ci-venv/bin/python -m ironmule_cli --help
          .ci-venv/bin/python -m ironmule_cli info
      - name: Static product and measurement checks
        run: |
          .ci-venv/bin/python -m pip install "ruff==0.16.6"
          .ci-venv/bin/ruff check ironmule_product ironmule_inventory.py ironmule_cli.py friday_evidence/events.py friday_evidence/identity.py friday_evidence/statistics.py tools/product_bounded_bench.py tools/product_history_snapshot.py --select F
      # A runner is not the target device. The research tree under tests/ binds
      # to this project's own machine by design -- gitignored evidence databases
      # under .friday-data/, a validated local model cache, and its own .venv
      # interpreter -- and AGENTS.md is explicit that a test asserting MLX, Metal
      # or model behaviour must have run on the target device. So CI runs the
      # engine package's own suite, which depends on nothing outside the
      # repository. The research suite runs on the target device, which is the
      # only place it can say anything true.
      - name: Engine test suite (no real-model integration)
        run: .ci-venv/bin/python -m pytest tests/engine -n 0 -m "not integration"

  # A figure that no longer matches its evidence is a false claim on the front page.
  # This regenerates every SVG from the committed artifacts and fails on any difference.
  figures:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: figures match their evidence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the figure toolchain
        run: python -m pip install "matplotlib>=3.8,<4"
      - name: Regenerate and compare
        run: python tools/make_figures.py --check

  # The README quick start is a contract. This job runs it the way a reader does:
  # a clone this workflow did not prepare, an editable install, and the commands
  # the README prints -- so a change that breaks the first five minutes fails here
  # rather than in somebody's terminal.
  fresh-clone:
    runs-on: macos-14
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    name: fresh clone / py${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Editable install from the clone
        run: python -m pip install -e .
      # `doctor` exits 1 when a prerequisite is missing, which on a virtualised
      # runner is a true report rather than a failure of this job. What is checked
      # here is that it runs and prints a report; exit 2 or a traceback still fails.
      - name: Quick start, verbatim
        run: |
          ironmule doctor || test $? -eq 1
          ironmule models list
          ironmule benchmark --help
          ironmule serve --help
          ironmule info
