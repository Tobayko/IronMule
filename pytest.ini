[pytest]
testpaths = tests
# Parallel by default: the suite drops from ~90 s to ~31 s on a 10-core machine.
# The floor is one 17.6 s test running 16 full 10.000-draw bootstraps, so more
# workers past this point buy nothing -- Amdahl, not configuration.
#
# Run sequentially when a failure is easier to read that way:
#   pytest -n 0
# (not `-p no:xdist`: that removes the plugin while `-n auto` stays in addopts,
#  and pytest then rejects the flag it no longer understands)
addopts = -q -n auto
