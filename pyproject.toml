[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ironmule"
dynamic = ["version"]
description = "Run and benchmark local LLM inference on Apple Silicon with MLX, correctness checks, and reproducible evidence"
readme = "README.md"
authors = [{ name = "Tobias Abenthum" }]
requires-python = ">=3.10"
license = "LicenseRef-IronMule-2.0"
license-files = ["LICENSE.md"]
dependencies = ["mlx>=0.32,<0.33", "mlx-lm>=0.31.3,<0.32", "numpy>=1.24"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: GPU",
  "Intended Audience :: Developers",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["mlx", "apple-mlx", "apple-silicon", "local-llm", "local-ai",
            "llm-inference", "ai-inference", "inference-runtime", "kv-cache",
            "prefix-caching", "ttft", "batching", "on-device-ai", "benchmarking"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-xdist>=3"]

[project.urls]
Homepage = "https://github.com/Tobayko/IronMule"
Documentation = "https://github.com/Tobayko/IronMule/blob/main/docs/RUNTIME.md"
Issues = "https://github.com/Tobayko/IronMule/issues"
Repository = "https://github.com/Tobayko/IronMule"

[tool.setuptools]
packages = ["ironmule"]
py-modules = ["ironmule_cli"]

[tool.setuptools.dynamic]
version = { attr = "ironmule._version.__version__" }

[project.scripts]
ironmule = "ironmule_cli:main"
